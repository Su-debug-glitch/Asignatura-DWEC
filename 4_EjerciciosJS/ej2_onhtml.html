<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="ej2-onhtml.js"></script>
    <title>Sucesos al hacer click</title>
</head>
<body>
    <p>Demostración de evento onkeypress: </p>
    <input type="text" onkeypress="eventOnKeyPress(this)">

    <p>Demostración de evento onkeyup: </p>
    <input type="text" onkeyup="eventOnKeyUp(this)">

    <p>Demostración de evento onfocus: </p>
    <input type="text" onfocus="eventOnFocus(this)">

    <p>Demostración de evento onblur: </p>
    <input type="text" onblur="eventOnBlur(this)">

    <p>Demostración de evento onselect: </p>
    <input type="text" value="Seleccioname" onselect="eventOnSelect(this)">
</body>
</html>
