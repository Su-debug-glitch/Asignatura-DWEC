<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link rel="stylesheet" href="Form.css">
</head>
<body>
    <div class="container">
    <form action="#" method="post">
        <label for="nombre" class="label">*Nombre</label><br>
        <input type="text" class="input" id="nombre" placeholder="name" required><br>
        <label for="email" class="label">*Correo electrónico</label><br>
        <input type="email" class="input" id="email" placeholder="mail" required><br>
        <label for="asunto" class="label">*Asunto</label><br>
        <input type="text" class="input" id="asunto" placeholder="about" required><br>
        <label for="mensaje" class="label">*Mensaje</label><br>
        <textarea class="input" id="mensaje" placeholder="text"></textarea><br>

        <label for="btn-blue" class="center-content"></label><br>
        <input type="submit" id="btn-blue" value="Enviar Datos">

        <p class="label">*Campos requeridos</p>
    </form>
    </div>
</body>
</html>
